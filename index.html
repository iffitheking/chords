<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Guitar chord songbook: transpose, auto-scroll, chord diagrams, setlists. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Chord Library</title>
<style>
:root { --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", "Cascadia Mono", Consolas, Menlo, "Courier New", monospace;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --radius: 14px; }
body.dark { --bg:#0f1115; --side:#15181e; --card:#1a1d24; --card2:#232731; --hover:#20242d; --sel:#2a2f3d; --border:#262a33;
  --text:#e9ebef; --sub:#a0a6b1; --muted:#6c7380; --accent:#7c5cff; --accent2:#9479ff; --chord:#ffb547; --section:#7cc4ff;
  --banner:#2a2440; --danger:#ff6b6b; --shadow: 0 10px 30px rgba(0,0,0,.45); }
body.light { --bg:#f3f4f7; --side:#ffffff; --card:#ffffff; --card2:#eceef3; --hover:#f2f3f7; --sel:#ece8ff; --border:#e2e5eb;
  --text:#1b2130; --sub:#566072; --muted:#939bab; --accent:#6a4cff; --accent2:#5737f2; --chord:#d9480f; --section:#1c6fd1;
  --banner:#efeaff; --danger:#e03131; --shadow: 0 10px 30px rgba(20,25,40,.18); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--ui); font-size:15px; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display:block; }
svg.i .f { fill: currentColor; stroke: none; }
.hidden { display: none !important; }

.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.bar { display:flex; align-items:center; gap:8px; padding: 10px 12px; }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; flex:1; min-width:0; }
.brand .note { color: var(--accent); font-size: 22px; }
.ibtn { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color: var(--text); flex: none; }
.ibtn:active { background: var(--card2); }
.btn { height:40px; padding: 0 16px; border-radius: 12px; background: var(--card2); font-weight: 600; white-space: nowrap; }
.btn:active { background: var(--sel); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:active { background: var(--accent2); }
.btn.danger { color: var(--danger); }
.btn:disabled, .ibtn:disabled { opacity: .4; }

/* library */
.seg { display:grid; grid-template-columns: 1fr 1fr; gap:6px; background: var(--card); border-radius: 13px; padding: 4px; margin: 0 14px 10px; }
.seg button { height: 36px; border-radius: 10px; font-weight: 600; color: var(--sub); }
.seg button.on { background: var(--accent); color:#fff; }
.search { margin: 0 14px; position: relative; }
.search input { width:100%; height:44px; border-radius: 13px; border: 1px solid var(--border); background: var(--card); padding: 0 40px 0 40px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search .ico { position:absolute; left: 11px; top: 11px; color: var(--muted); }
.search .clr { position:absolute; right: 4px; top: 2px; color: var(--muted); }
.filters { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 14px 0; }
.sel { height: 40px; width:100%; border-radius: 11px; border: 1px solid var(--border); background: var(--card); padding: 0 10px; outline:none; appearance: auto; }
.setrow { display:flex; gap:8px; margin: 10px 14px 0; align-items:center; }
.setrow .sel { flex: 1; }
.setrow .ibtn { background: var(--card2); width: 40px; height: 40px; }
.setrow .ibtn.primary { background: var(--accent); color: #fff; }
.metarow { display:flex; align-items:center; justify-content: space-between; margin: 10px 16px 4px; color: var(--muted); font-size: 13px; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--card); border: 1px solid var(--border); color: var(--sub); font-size: 13px; font-weight: 600; }
.chip.on { background: var(--sel); color: var(--text); border-color: var(--accent); }
.chips { display:flex; gap: 6px; }
.chips .chip { height: 30px; padding: 0 11px; }
.favmark { color: #ffc24a; margin-right: 4px; }
.ibtn.star.on { color: #ffc24a; }
.ibtn.on { color: var(--accent); }
.beatbar { display:flex; align-items:center; gap: 10px; margin: 0 10px 8px; padding: 7px 12px; border-radius: 11px; background: var(--card); border: 1px solid var(--border);
  font-size: 13px; color: var(--sub); text-align: left; flex: none; }
.beatbar b { color: var(--text); font-family: var(--mono); font-weight: 700; }
.beatbar .dots { display:flex; gap: 5px; }
.beatbar .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--sel); }
.beatbar .dot.on { background: var(--accent); } .beatbar .dot.on.acc { background: var(--chord); }
.notes { margin: 0 10px 8px; padding: 8px 12px; border-radius: 11px; background: var(--banner); color: var(--text); font-size: 13.5px; line-height: 1.4;
  white-space: pre-wrap; text-align: left; flex: none; max-height: 30vh; overflow: auto; }
.lenbtn { height: 30px; padding: 0 9px; border-radius: 9px; background: var(--card2); color: var(--text); font-weight: 700; font-size: 12px; white-space: nowrap; flex: none; }
.lenbtn.on { background: var(--accent); color: #fff; }
.prow2 input[type=range].auto { opacity: .35; }
.field textarea { width:100%; min-height: 120px; border-radius: 11px; border: 1px solid var(--border); background: var(--card); padding: 10px 12px; outline:none; resize: vertical; font: inherit; color: var(--text); }
.field textarea:focus { border-color: var(--accent); }
.metro .big { font-size: 44px; font-weight: 800; text-align:center; font-family: var(--mono); margin: 6px 0 2px; }
.metro .row2 { display:flex; gap: 6px; justify-content:center; margin: 8px 0 14px; flex-wrap: wrap; }
.metro .row2 .btn { padding: 0 12px; }
.tuner { align-items: center; text-align: center; }
.tuner .note { font-size: 96px; font-weight: 800; line-height: 1; margin-top: 24px; font-family: var(--ui); }
.tuner .oct { font-size: 28px; color: var(--sub); }
.tuner .cents { font-size: 16px; color: var(--sub); margin: 8px 0 18px; min-height: 22px; }
.tuner .meter { position: relative; width: min(86vw, 420px); height: 54px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); margin: 0 auto; }
.tuner .meter .mid { position:absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; margin-left: -1px; background: var(--muted); }
.tuner .meter .needle { position:absolute; top: 4px; bottom: 4px; width: 8px; margin-left: -4px; border-radius: 4px; background: var(--chord); left: 50%; transition: left .12s linear; }
.tuner .meter .needle.ok { background: #2fbf71; }
.tuner .strings { display:flex; gap: 8px; justify-content:center; margin: 26px 0 10px; }
.tuner .strings span { width: 42px; height: 42px; border-radius: 21px; display:grid; place-items:center; background: var(--card); border: 1px solid var(--border); font-weight: 750; }
.tuner .strings span.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tuner .freq { color: var(--muted); font-size: 13px; }
.tour { text-align: center; }
.tour .big { font-size: 46px; margin: 4px 0 6px; }
.tour .dots { display:flex; gap: 6px; justify-content:center; margin: 4px 0 14px; }
.tour .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--sel); }
.tour .dots i.on { background: var(--accent); }
.list { flex:1; overflow-y:auto; padding: 4px 8px 100px; -webkit-overflow-scrolling: touch; }
.row { display:flex; align-items:center; gap:10px; padding: 11px 12px; border-radius: 12px; min-height: 60px; }
.row:active { background: var(--hover); }
.row.cur { background: var(--sel); }
.row .num { width: 22px; text-align: right; color: var(--muted); font-size: 13px; flex: none; }
.row .txt { flex:1; min-width:0; }
.row .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .a { color: var(--sub); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .a.unk { color: var(--muted); }
.row .ord { display:flex; gap: 2px; }
.row .ord .ibtn { width: 38px; height: 38px; background: var(--card2); }
.empty { text-align:center; color: var(--muted); padding: 50px 30px; line-height: 1.6; white-space: pre-line; }
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); height: 54px; padding: 0 22px 0 18px; border-radius: 18px;
  background: var(--accent); color:#fff; font-weight: 700; display:flex; align-items:center; gap: 8px; box-shadow: var(--shadow); }

/* song */
.topbar { display:flex; align-items:center; gap: 4px; padding: 6px 6px 4px; }
.titles { flex:1; min-width:0; padding: 0 4px; }
.titles .t { font-size: 19px; font-weight: 750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titles .a { font-size: 13.5px; color: var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tools { display:flex; align-items:center; gap: 4px; padding: 2px 10px 8px; overflow-x: auto; scrollbar-width: none; }
.tools::-webkit-scrollbar { display:none; }
.grp { display:flex; align-items:center; gap: 2px; background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 2px; flex:none; }
.grp .cap { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--muted); padding: 0 6px 0 8px; }
.grp button { min-width: 34px; height: 34px; border-radius: 9px; font-weight: 700; padding: 0 6px; }
.grp button:active { background: var(--card2); }
.grp .val { min-width: 30px; text-align:center; font-weight: 750; }
.grp button.on { background: var(--sel); color: var(--text); }
.strip { display:flex; gap: 8px; overflow-x:auto; padding: 0 12px 8px; scrollbar-width: none; flex: none; }
.strip::-webkit-scrollbar { display:none; }
.dcard { flex:none; background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 0; width: 88px; }
.strip.s-small .dcard { width: 66px; } .strip.s-small .foot { display:none; }
.strip.s-large .dcard { width: 118px; }
.dcard.dsize { width: 46px !important; color: var(--sub); font-size: 11px; font-weight: 700; line-height: 1.5; }
.dcard.dsize b { display:block; font-size: 17px; color: var(--text); }
.dcard svg { display:block; width:100%; height:auto; }
.dg-name { fill: var(--text); font: 700 13px var(--ui); }
.dg-line { stroke: var(--muted); stroke-width: 1; }
.dg-nut { stroke: var(--text); stroke-width: 4; }
.dg-dot { fill: var(--accent); }
.dg-barre { stroke: var(--accent); stroke-linecap: round; }
.dg-mark { fill: var(--sub); font: 11px var(--ui); }
.dg-open { stroke: var(--sub); stroke-width: 1.4; fill: none; }
.dg-foot { fill: var(--muted); font: 9.5px var(--ui); }
.sheetwrap { flex:1; min-height:0; margin: 0 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display:flex; }
.sheetscroll { flex:1; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
pre.sheet { margin:0; padding: 16px 18px 45vh; font-family: var(--mono); font-size: 15px; line-height: 1.45; white-space: pre; color: var(--text); min-width: max-content; }
pre.sheet .c { color: var(--chord); font-weight: 700; }
pre.sheet .s { color: var(--section); font-weight: 700; }
pre.sheet .m { color: var(--muted); }
pre.sheet.wrap { min-width: 0; }
pre.sheet .wm { display: inline-block; width: 2ch; color: var(--accent); font-weight: 700; }
pre.sheet .ch { cursor: pointer; border-radius: 4px; }
pre.sheet .ch.picked { color: var(--danger); background: rgba(255, 90, 90, .16); }
.dcard.picked { border-color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.dcard.picked .dg-name { fill: var(--danger); }
.dcard.picked .dg-dot { fill: var(--danger); }
.dcard.picked .dg-barre { stroke: var(--danger); }
.player { background: var(--side); border-top: 1px solid var(--border); margin-top: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
.prow { display:flex; align-items:center; gap: 6px; }
.play { width: 52px; height: 52px; border-radius: 26px; background: var(--accent); color:#fff; display:grid; place-items:center; flex:none; }
.play svg.i { width: 26px; height: 26px; }
.status { flex:1; min-width:0; padding: 0 6px; }
.status .h { font-weight: 700; font-size: 14px; }
.status .m { font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
.status .go { display:inline-block; margin-top: 3px; padding: 3px 10px; border-radius: 10px; background: var(--accent); color:#fff; font-size: 12px; font-weight: 700; }
.prow2 { display:flex; align-items:center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.prow2 .lab { font-weight: 800; font-size: 10px; letter-spacing: .06em; }
.prow2 input[type=range] { flex:1; min-width: 60px; accent-color: var(--accent); }
.prow2 .v { color: var(--sub); min-width: 50px; }
.delay { display:flex; align-items:center; gap: 2px; }
.delay button { width: 32px; height: 30px; border-radius: 9px; background: var(--card2); font-weight: 800; color: var(--text); }
.delay .dv { min-width: 34px; text-align:center; color: var(--text); font-weight: 750; font-size: 13px; }
body.stage .tools .grp:not(#textGrp), body.stage .prow2, body.stage #songTopbar .titles .a { display:none; }
body.stage .sheetwrap { margin: 0; border-radius: 0; border-left: 0; border-right: 0; }

/* overlays */
.layer { position: fixed; inset: 0; z-index: 50; display:flex; flex-direction: column; }
.backdrop { position:absolute; inset:0; background: rgba(0,0,0,.5); }
.sheetmenu { position: absolute; left: 0; right: 0; bottom: 0; background: var(--side); border-radius: 20px 20px 0 0; padding: 8px 8px calc(12px + env(safe-area-inset-bottom));
  max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheetmenu .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--sel); margin: 4px auto 8px; }
.sheetmenu .mt { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--muted); padding: 6px 14px 8px; text-transform: uppercase; }
.mi { display:flex; align-items:center; gap: 12px; width:100%; text-align:left; padding: 14px; border-radius: 12px; font-size: 15.5px; }
.mi:active { background: var(--card2); }
.mi:disabled { opacity: .4; }
.mi .ck { margin-left:auto; width: 40px; height: 24px; border-radius: 12px; background: var(--sel); position: relative; flex: none; }
.mi .ck::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:9px; background:#fff; transition: left .15s; }
.mi .ck.on { background: var(--accent); } .mi .ck.on::after { left: 19px; }
.mi.danger { color: var(--danger); }
.mi .arrow { margin-left: auto; color: var(--muted); }
.sep { height:1px; background: var(--border); margin: 6px 10px; }
.dialog { position: relative; margin: auto; width: min(92vw, 420px); background: var(--side); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.dialog h3 { margin: 0 0 8px; font-size: 18px; }
.dialog p { margin: 0 0 16px; color: var(--sub); line-height: 1.5; white-space: pre-line; }
.dialog .btns { display:flex; justify-content: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.field { margin-bottom: 12px; }
.field label { display:block; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
.field input { width:100%; height: 44px; border-radius: 11px; border: 1px solid var(--border); background: var(--card); padding: 0 12px; outline:none; }
.field input:focus { border-color: var(--accent); }
.full { position: absolute; inset: 0; background: var(--bg); display:flex; flex-direction:column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.full .bar h2 { margin:0; font-size: 18px; flex:1; }
.full .body { flex:1; min-height:0; display:flex; flex-direction:column; padding: 0 14px 12px; }
.twofields { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tabs { display:flex; gap: 6px; margin-bottom: 8px; }
.tabs button { flex:1; height: 38px; border-radius: 11px; background: var(--card); color: var(--sub); font-weight: 650; border: 1px solid var(--border); }
.tabs button.on { background: var(--sel); color: var(--text); border-color: var(--accent); }
textarea.code, pre.preview { flex:1; min-height: 0; width:100%; border-radius: 13px; border: 1px solid var(--border); background: var(--card); padding: 12px;
  font-family: var(--mono); font-size: 13.5px; line-height: 1.45; outline: none; resize: none; white-space: pre; overflow: auto; margin: 0; }
textarea.code:focus { border-color: var(--accent); }
pre.preview .c { color: var(--chord); font-weight: 700; } pre.preview .s { color: var(--section); font-weight: 700; } pre.preview .m { color: var(--muted); }
pre.preview .hint { color: var(--muted); font-family: var(--ui); white-space: pre-wrap; }
.info { font-size: 12.5px; color: var(--sub); padding: 8px 2px 0; min-height: 22px; }
.pastebar { display:flex; gap: 8px; margin-bottom: 8px; }
.help { overflow-y:auto; line-height: 1.6; color: var(--sub); padding-bottom: 30px; }
.help h4 { color: var(--text); margin: 18px 0 4px; font-size: 15.5px; }
.help b { color: var(--text); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 80; background: var(--text); color: var(--bg);
  border-radius: 14px; padding: 12px 16px; font-size: 14px; display:flex; gap: 14px; align-items:center; max-width: 92vw; box-shadow: var(--shadow); }
.toast button { color: var(--accent2); font-weight: 800; }
body.light .toast button { color: #b9a8ff; }
@media (min-width: 760px) { pre.sheet { padding-left: 28px; } .list { padding-left: 14px; padding-right: 14px; } }
</style>
</head>
<body class="dark">

<!-- ================= Library ================= -->
<section class="screen" id="libScreen">
  <div class="bar">
    <div class="brand"><span class="note">♫</span><span>Chord Library</span></div>
    <button class="ibtn" id="themeBtn" aria-label="Light or dark"></button>
    <button class="ibtn" id="libMenuBtn" aria-label="Menu"></button>
  </div>
  <div class="seg"><button id="segLib" class="on">Library</button><button id="segSet">Setlists</button></div>
  <div class="search">
    <span class="ico" id="searchIco"></span>
    <input id="search" type="search" placeholder="Search songs or artists" autocomplete="off" enterkeyhint="search">
    <button class="ibtn clr hidden" id="searchClr" aria-label="Clear"></button>
  </div>
  <div class="filters" id="filters">
    <select class="sel" id="artistSel" aria-label="Artist"></select>
    <select class="sel" id="sortSel" aria-label="Sort"></select>
  </div>
  <div class="setrow hidden" id="setRow">
    <select class="sel" id="setSel" aria-label="Setlist"></select>
    <button class="ibtn primary" id="setNew" aria-label="New setlist"></button>
    <button class="ibtn" id="setMenu" aria-label="Setlist options"></button>
  </div>
  <div class="metarow"><div class="chips" id="chips"><button class="chip" data-f="all">All</button><button class="chip" data-f="fav">★ Favourites</button><button class="chip" data-f="recent">Recent</button></div><span id="count"></span></div>
  <div class="list" id="songList"></div>
  <button class="fab" id="addBtn"><span id="addIco"></span>Add song</button>
</section>

<!-- ================= Song ================= -->
<section class="screen hidden" id="songScreen">
  <div class="topbar" id="songTopbar">
    <button class="ibtn" id="backBtn" aria-label="Back"></button>
    <div class="titles"><div class="t" id="songTitle"></div><div class="a" id="songArtist"></div></div>
    <button class="ibtn star" id="favBtn" aria-label="Favourite"></button>
    <button class="ibtn" id="songMenuBtn" aria-label="Song options"></button>
  </div>
  <div class="tools">
    <div class="grp"><span class="cap">KEY</span><button id="keyDown">♭</button><button class="val" id="keyVal">0</button><button id="keyUp">♯</button></div>
    <div class="grp" id="textGrp"><button id="sizeDown">A−</button><button id="sizeUp">A+</button><button id="fitBtn">Fit</button></div>
    <div class="grp"><button id="chordsBtn">Chords</button></div>
  </div>
  <div class="strip" id="strip"></div>
  <button class="beatbar hidden" id="beatBar"></button>
  <button class="notes hidden" id="notesCard"></button>
  <div class="sheetwrap"><div class="sheetscroll" id="sheetScroll"><pre class="sheet" id="sheet"></pre></div></div>
  <div class="player">
    <div class="prow">
      <button class="ibtn" id="prevBtn" aria-label="Previous song"></button>
      <button class="play" id="playBtn" aria-label="Play"></button>
      <button class="ibtn" id="nextBtn" aria-label="Next song"></button>
      <div class="status"><div class="h">Auto-scroll</div><div class="m" id="statusMsg">Tap play to start</div></div>
      <button class="ibtn" id="metroBtn" aria-label="Metronome"></button>
      <button class="ibtn" id="stageBtn" aria-label="Stage mode"></button>
    </div>
    <div class="prow2">

<script>// Chord Library Pro, mobile: chord logic ported from chord_library_pro.py (v4.2).
// Pure functions, no page code, so it can be tested in Node against the Python version.
(function (global) {
  "use strict";

  const SHARP_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const FLAT_NOTES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
  const NOTE_INDEX = {};
  SHARP_NOTES.forEach((n, i) => (NOTE_INDEX[n] = i));
  FLAT_NOTES.forEach((n, i) => (NOTE_INDEX[n] = i));
  Object.assign(NOTE_INDEX, { Cb: 11, Fb: 4, "E#": 5, "B#": 0 });

  const CHORD_RE = new RegExp(
    "^(?<root>[A-G][#b]?)" +
    "(?<quality>(?:maj|min|dim|aug|sus|add|m|M|\\+|°|ø)?[0-9]*" +
    "(?:(?:maj|min|dim|aug|sus|add|b|#|\\+|-)?[0-9]+)*)" +

  const INFO_LINE_RE = /^\s*(tuning|key|capo|strumming|tempo|bpm|time signature)\s*:/i;

  // ---------- small Python-like helpers ----------
  function stripChars(s, chars) {
    let a = 0, b = s.length;
    while (a < b && chars.includes(s[a])) a++;

  }
  function lstripChars(s, chars) { let a = 0; while (a < s.length && chars.includes(s[a])) a++; return s.slice(a); }
  function rstripChars(s, chars) { let b = s.length; while (b > 0 && chars.includes(s[b - 1])) b--; return s.slice(0, b); }
  function pySplit(s) { const t = s.trim(); return t ? t.split(/\s+/) : []; }
  function rstrip(s) { return s.replace(/\s+$/, ""); }
  function tokens(s, start) {
    const re = /\S+/g; re.lastIndex = start || 0;
    const out = []; let m;
    while ((m = re.exec(s))) out.push({ text: m[0], start: m.index, end: m.index + m[0].length });
    return out;
  }
  function splitLines(s) { return s.split(/\r\n|\r|\n/); }
  function expandTabs(s, size) {
    if (!s.includes("\t")) return s;
    let out = "";

    }

  }
  function titleCase(s) { return s.replace(/[A-Za-z]+/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()); }
  function isSpace(ch) { return /\s/.test(ch); }

  // ---------- chords ----------
  function isChord(token) {
    token = stripChars(token, "()[]");
    return !!token && CHORD_RE.test(token);
  }

  function isChordLine(line) {
    if (INFO_LINE_RE.test(line)) return false;
    const body = SECTION_LABEL.test(line) ? line.replace(SECTION_LABEL, "") : line;
    const toks = pySplit(body);
    if (!toks.length) return false;
    if (toks.length === 6 && toks.every(t => /^[A-Ga-g][#b]?$/.test(t)) &&
        toks[0].toLowerCase() === toks[5].toLowerCase()) return false;
    let chords = 0;
    for (const t of toks) {

    }
    return chords > 0;
  }

  function mod12(n) { return ((n % 12) + 12) % 12; }

  function transposeNote(note, steps, preferFlats) {
    return (preferFlats ? FLAT_NOTES : SHARP_NOTES)[mod12(NOTE_INDEX[note] + steps)];
  }

  function transposeChord(token, steps) {
    if (mod12(steps) === 0) return token;
    const lead = token.length - lstripChars(token, "([").length;
    const trail = token.length - rstripChars(token, ")]").length;
    const core = token.slice(lead, trail ? token.length - trail : undefined);
    const m = CHORD_RE.exec(core);
    if (!m) return token;
    const g = m.groups;
    const flats = g.root.slice(1).includes("b");

  function parseSongMeta(filename, content) {
    const base = filename.replace(/\.[^.]*$/, "") || filename;

    let m = /^\s*(?:Artist|Band|Singer)\s*[:\-]\s*(.+?)\s*$/im.exec(head);
    if (m) artist = m[1];
    m = /^\s*(?:Title|Song)\s*[:\-]\s*(.+?)\s*$/im.exec(head);
    if (m) title = m[1];
    const i = base.indexOf(" - ");
    if (i >= 0) {
      artist = artist || base.slice(0, i).trim();
      title = title || base.slice(i + 3).trim();
    }
    return [title || base, artist || ""];
  }

  function safeFilename(name) { return name.replace(/[<>:"/\\|?*]/g, "").trim(); }

  // ---------- layout cleaner ----------
  const SECTION_WORDS = "intro|verse|pre[\\s-]?chorus|chorus|bridge|outro|interlude|solo|hook|refrain|" +
    "instrumental|break|coda|ending|antara|mukhda|sthayi|tag|riff";
  const SECTION_RE = new RegExp(
    "^\\s*(?<open>[\\[\\(\\{])?\\s*(?<word>" + SECTION_WORDS + ")\\s*(?<num>\\d+)?\\s*" +
    "(?<close>[\\]\\)\\}])?\\s*(?<colon>[:.\\-])?\\s*(?<rest>.*?)\\s*$", "i");
  const REPEAT_RE = /^\(?\s*x\s*\d+\s*\)?$|^\(?\s*\d+\s*x\s*\)?$/i;
  const BRACKET_CHORD_RE = /[\[\(]([^\[\]\(\)\s]{1,12})[\]\)]/g;
  const DIRECTIVE_RE = /^\s*\{\s*([A-Za-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/;
  const WEAK_CHORDS = new Set(["A", "Am"]);

  function formatSection(word, num, extra) {
    word = word.toLowerCase().replace(/\s+|-/g, " ").trim();
    let label = word.replace(/ /g, "") === "prechorus" ? "Pre-Chorus" : titleCase(word);
    if (num) label += " " + num;
    if (extra) label += " " + extra;
    return "[" + label + "]";
  }

  function parseSection(line) {
    const m = SECTION_RE.exec(line);
    if (!m) return null;
    const g = m.groups;
    let rest = g.rest;
    let marked = !!(g.open || g.close || g.colon);
    if (g.open && !g.close && /[\])}]$/.test(rest)) {
      rest = rest.slice(0, -1).trim();
      marked = true;
    }
    let extra = "";
    if (rest && REPEAT_RE.test(rest)) {
      extra = rest.replace(/[()\s]/g, "").toLowerCase();
      rest = "";
    }
    if (rest && !marked && !isChordLine(rest)) return null;
    return [formatSection(g.word, g.num, extra), rest];
  }

  function place(chordLine, col, chord) {
    if (chordLine && col <= chordLine.length) col = chordLine.length + 1;
    return chordLine.padEnd(col) + chord;
  }

  function splitBracketChords(line) {
    const matches = [];
    let m;
    BRACKET_CHORD_RE.lastIndex = 0;
    while ((m = BRACKET_CHORD_RE.exec(line))) if (isChord(m[1])) matches.push(m);
    if (!matches.length) return null;
    let lyric = "", chords = "", pos = 0;
    for (const mm of matches) {
      lyric += line.slice(pos, mm.index);
      chords = place(chords, lyric.length, mm[1]);
      pos = mm.index + mm[0].length;
    }
    lyric += line.slice(pos);
    if (!lyric.trim()) return [chords, null];
    return [chords, rstrip(lyric)];
  }

  function splitBareChords(line) {
    const toks = tokens(line);
    // a tuning line such as "E A D G B e" is not chords (fix over desktop v4.2)
    if (isTuningLine(toks.map(t => t.text))) return null;
    const chordToks = toks.filter(t => isChord(t.text));
    const words = toks.filter(t => !isChord(t.text));
    const strong = chordToks.filter(t => !WEAK_CHORDS.has(stripChars(t.text, "()[]")));
    if (chordToks.length < 2 || !strong.length || !words.length) return null;
    let lyric = "", chords = "", pending = [];
    for (const t of toks) {
      if (isChord(t.text)) { pending.push(stripChars(t.text, "()[]")); continue; }
      if (lyric) lyric += " ";
      let col = lyric.length;
      for (const ch of pending) { chords = place(chords, col, ch); col = chords.length + 1; }
      pending = [];
      lyric += t.text;
    }
    for (const ch of pending) chords = place(chords, lyric.length + 1, ch);
    return [chords, lyric];
  }

  function isTuningLine(toks) { return toks.length === 6 && toks.every(t => /^[A-Ga-g][#b]?$/.test(t)); }

  function fixLowercaseChordLine(line) {
    const toks = pySplit(line);
    if (toks.length < 2 || line !== line.toLowerCase()) return null;
    const caps = toks.map(t => t[0].toUpperCase() + t.slice(1));
    if (!caps.every(c => isChord(c) || CHORD_LINE_EXTRAS.test(c))) return null;
    const strong = caps.some(c => /[0-9#/]/.test(c));
    if (toks.length < 3 && !strong) return null;
    return line.replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1));
  }

  function cleanLine(line) {
    if (!line.trim()) return [""];
    if (INFO_LINE_RE.test(line)) return [line.trim()];
    let split = splitBracketChords(line);
    if (split) return split[1] === null ? [split[0]] : [split[0], split[1]];
    if (isChordLine(line)) return [line];
    const fixed = fixLowercaseChordLine(line);
    if (fixed) return [fixed];
    split = splitBareChords(line);
    if (split) return split[1] === null ? [split[0]] : [split[0], split[1]];
    return [line];
  }

  function isHeaderLike(line) { return line.startsWith("[") && line.endsWith("]"); }

  function normalizeSong(text) {
    text = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/ /g, " ").replace(/﻿/g, "");
    const out = [];
    for (const raw of text.split("\n")) {
      const line = rstrip(expandTabs(raw, 8));
      const d = DIRECTIVE_RE.exec(line);
      if (d) {
        const key = d[1].toLowerCase(), val = (d[2] || "").trim();
        if (key === "title" || key === "t") out.push("Title: " + val);
        else if (key === "artist" || key === "subtitle" || key === "st") out.push("Artist: " + val);
        else if (key === "start_of_chorus" || key === "soc") out.push(formatSection("chorus", null));
        else if (key === "start_of_verse" || key === "sov") out.push(formatSection("verse", null));
        else if (key === "start_of_bridge" || key === "sob") out.push(formatSection("bridge", null));
        else if (["comment", "c", "comment_italic", "ci"].includes(key) && val) {
          const sec = parseSection(val);
          out.push(sec && !sec[1] ? sec[0] : "[" + val + "]");
        }
        continue;
      }
      const sec = parseSection(line);
      if (sec) {
        out.push(sec[0]);
        if (sec[1]) out.push(...cleanLine(sec[1].trim()));
        continue;
      }
      out.push(...cleanLine(line));
    }
    const tidy = [];
    for (const line of out) {
      const header = isHeaderLike(line) && !isChordLine(line);
      if (!line.trim()) {
        const last = tidy[tidy.length - 1];
        if (tidy.length && last.trim() && !isHeaderLike(last)) tidy.push("");
        continue;
      }
      if (header && tidy.length && tidy[tidy.length - 1].trim()) tidy.push("");
      tidy.push(line);
    }
    while (tidy.length && !tidy[tidy.length - 1].trim()) tidy.pop();
    return tidy.join("\n");
  }

  const META_RE = /^\s*(title|artist|band|singer|song)\s*[:\-]/i;

  function stripMetaHeader(text) {
    const lines = text.split("\n");
    let i = 0;
    while (i < lines.length && i < 6 && (META_RE.test(lines[i]) || !lines[i].trim())) i++;
    if (i === 0 || !lines.slice(0, i).some(l => META_RE.test(l))) return text;
    return lines.slice(i).join("\n");
  }

  // ---------- chord shapes ----------

    "F": "133211", "B": "x24442", "Bb": "x13331",
    "Am": "x02210", "Dm": "xx0231", "Em": "022000", "Bm": "x24432", "F#m": "244222",
    "Cm": "x35543", "Gm": "355333", "Fm": "133111", "C#m": "x46654",
    "C7": "x32310", "D7": "xx0212", "E7": "020100", "G7": "320001", "A7": "x02020",
    "B7": "x21202", "F7": "131211",
    "Am7": "x02010", "Dm7": "xx0211", "Em7": "022030", "Bm7": "x20202", "F#m7": "242222",
    "Cmaj7": "x32000", "Dmaj7": "xx0222", "Emaj7": "021100", "Fmaj7": "xx3210",
    "Gmaj7": "320002", "Amaj7": "x02120",
    "Dsus2": "xx0230", "Dsus4": "xx0233", "Asus2": "x02200", "Asus4": "x02230",
    "Esus4": "022200", "Csus4": "x33011", "Gsus4": "330013", "Csus2": "x30013",
    "Cadd9": "x32030", "Gadd9": "3x0203",
    "A6": "x02222", "D6": "xx0202", "E6": "022120", "G6": "320000", "C6": "x32210",
    "Am6": "x02212", "Em6": "022020", "Dm6": "xx0201",
    "E5": "022xxx", "A5": "x022xx", "D5": "xx023x", "G5": "355xxx",
    "A9": "x02423", "E9": "020102",
    "Ddim": "xx0131", "Bdim": "x2343x", "Edim": "0120xx",

    "A7sus4": "x02030", "E7sus4": "020200", "D7sus4": "xx0213",
    "D/F#": "200232", "G/B": "x20003", "C/G": "332010", "C/E": "032010", "C/B": "x22010",
    "Am/G": "302210", "Am/C": "x32210", "Am/F#": "202210", "D/A": "x00232", "F/C": "x33211",
    "F/A": "x03211", "A/C#": "x42220", "Em/D": "xx0000", "Em/B": "x22000", "G/F#": "2x0003",
    "D/C": "x30232", "E/G#": "422100", "A/E": "002220", "G/D": "xx0003", "Dm/C": "x30231",
  };
  const N = null;
  // [shape, offsets] pairs, in the same order as the Python dicts
  const MOVABLE_SHAPES = {
    "maj":   [["E", [0, 2, 2, 1, 0, 0]], ["A", [N, 0, 2, 2, 2, 0]]],
    "m":     [["E", [0, 2, 2, 0, 0, 0]], ["A", [N, 0, 2, 2, 1, 0]]],
    "7":     [["E", [0, 2, 0, 1, 0, 0]], ["A", [N, 0, 2, 0, 2, 0]]],
    "m7":    [["E", [0, 2, 0, 0, 0, 0]], ["A", [N, 0, 2, 0, 1, 0]]],
    "maj7":  [["E", [0, N, 1, 1, 0, N]], ["A", [N, 0, 2, 1, 2, 0]]],

    "m6":    [["E", [0, 2, 2, 0, 2, 0]], ["A", [N, 0, 2, 2, 1, 2]]],

    "dim7":  [["A", [N, 0, 1, 2, 1, 2]]],
    "aug":   [["E", [0, 3, 2, 1, 1, 0]], ["A", [N, 0, 3, 2, 2, 1]]],
    "m7b5":  [["A", [N, 0, 1, 0, 1, N]], ["E", [0, N, 0, 0, -1, N]]],
    "5":     [["E", [0, 2, 2, N, N, N]], ["A", [N, 0, 2, 2, N, N]]],

  };
  const SHAPE_BASE = { E: 4, A: 9 };
  const QUALITY_ALIASES = {
    "": "maj", "M": "maj", "maj": "maj", "m": "m", "min": "m", "-": "m",
    "7": "7", "dom7": "7", "m7": "m7", "min7": "m7", "-7": "m7",
    "maj7": "maj7", "M7": "maj7", "Maj7": "maj7", "sus4": "sus4", "sus": "sus4",
    "sus2": "sus2", "2": "sus2", "6": "6", "m6": "m6", "min6": "m6", "9": "9",
    "add9": "add9", "add2": "add9", "dim": "dim", "°": "dim", "o": "dim",
    "dim7": "dim7", "°7": "dim7", "o7": "dim7", "aug": "aug", "+": "aug",
    "m7b5": "m7b5", "ø": "m7b5", "ø7": "m7b5", "m7-5": "m7b5", "min7b5": "m7b5",
    "5": "5", "7sus4": "7sus4", "7sus": "7sus4", "sus4/7": "7sus4",
  };

  function canonicalQuality(q) {
    if (Object.prototype.hasOwnProperty.call(QUALITY_ALIASES, q)) return [QUALITY_ALIASES[q], false];
    if (q.startsWith("maj") || q.startsWith("M")) return ["maj7", true];
    if (q.startsWith("m") || q.startsWith("min") || q.startsWith("-")) return [/7|9|11|13/.test(q) ? "m7" : "m", true];
    if (q.includes("sus")) return [/7|9|11|13/.test(q) ? "7sus4" : "sus4", true];
    if (/7|9|11|13/.test(q)) return ["7", true];

  function parseFrets(text) {
    text = text.trim();
    const parts = /[\s\-]/.test(text) ? text.split(/[\s\-]+/) : Array.from(text);
    if (parts.length !== 6) return null;
    const out = [];
    for (const p of parts) {
      if (p.toLowerCase() === "x") out.push(null);
      else if (/^[0-9]+$/.test(p) && parseInt(p, 10) <= 24) out.push(parseInt(p, 10));
      else return null;
    }
    return out;

  const SHAPE_INDEX = new Map();
  for (const [name, frets] of Object.entries(OPEN_SHAPES)) {
    const g = CHORD_RE.exec(name).groups;
    const key = NOTE_INDEX[g.root] + "|" + canonicalQuality(g.quality)[0] + "|" + (g.bass ? NOTE_INDEX[g.bass] : "");
    if (!SHAPE_INDEX.has(key)) SHAPE_INDEX.set(key, parseFrets(frets));

  function sameFrets(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }
  function playedMin(f) { return Math.min(...f.filter(x => x !== null)); }

  function chordVoicings(name) {
    const m = CHORD_RE.exec(stripChars(name, "()[]"));
    if (!m) return [[], false];
    const g = m.groups;
    const root = NOTE_INDEX[g.root];
    const [quality, simplified] = canonicalQuality(g.quality);
    const bass = g.bass ? NOTE_INDEX[g.bass] : null;
    const found = [];
    if (bass !== null && SHAPE_INDEX.has(root + "|" + quality + "|" + bass)) found.push(SHAPE_INDEX.get(root + "|" + quality + "|" + bass));
    if (SHAPE_INDEX.has(root + "|" + quality + "|")) found.push(SHAPE_INDEX.get(root + "|" + quality + "|"));
    const movable = [];
    for (const [shape, offsets] of (MOVABLE_SHAPES[quality] || [])) {
      let r = mod12(root - SHAPE_BASE[shape]);
      if (r + playedMin(offsets) < 0) r += 12;
      const frets = offsets.map(o => (o === null ? null : o + r));
      if (Math.max(...frets.filter(x => x !== null)) <= 15) movable.push(frets);
    }
    movable.sort((a, b) => playedMin(a) - playedMin(b));
    found.push(...movable);
    const unique = [];
    for (const f of found) if (!unique.some(u => sameFrets(u, f))) unique.push(f);
    return [unique, simplified];
  }

  const FINGERING_RE = /^\s*(?<chord>[A-G][^\s:=]*)\s*[:=]?\s+(?<frets>[xX0-9]{6}|(?:[xX]|\d{1,2})(?:[\s\-]+(?:[xX]|\d{1,2})){5})\s*$/;

  function customFingerings(text) {
    const found = {};
    for (const line of text.split("\n")) {
      const m = FINGERING_RE.exec(line);

// ---------------------------------------------------------------- storage
// IndexedDB key/value store, falling back to localStorage, then to memory only.
const Store = {
  db: null, mode: "memory", mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("chord-library", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });

    } catch (e) {
      try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); this.mode = "ls"; } catch (e2) { this.mode = "memory"; }
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  },
  async all() {
    const out = new Map();
    if (this.mode === "idb") {
      await new Promise((res, rej) => {
        const st = this.db.transaction("kv").objectStore("kv");
        const req = st.openCursor();
        req.onsuccess = () => { const c = req.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(); };
        req.onerror = () => rej(req.error);
      });
    } else if (this.mode === "ls") {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith("cl:")) try { out.set(k.slice(3), JSON.parse(localStorage.getItem(k))); } catch (e) {}
      }
    } else return new Map(this.mem);
    return out;
  },
  async put(key, value) {
    this.mem.set(key, value);
    try {
      if (this.mode === "idb") await new Promise((res, rej) => {
        const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(value, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      else if (this.mode === "ls") localStorage.setItem("cl:" + key, JSON.stringify(value));
    } catch (e) { toast("Could not save: " + (e && e.message || e)); }
  },
  async del(key) {
    this.mem.delete(key);
    try {
      if (this.mode === "idb") await new Promise((res, rej) => {
        const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });

    } catch (e) {}

// ---------------------------------------------------------------- state
const DEFAULT_SETTINGS = {
  theme: "dark", sort: "Name (A-Z)", searchLyrics: false, highlight: true, clean: true, diagrams: true,
  diagramSize: "medium", defaultSpeed: 0.5, defaultDelay: 20, defaultSize: 15, view: "library",
  currentSetlist: null, lastSong: null, keepAwake: true, wrap: true, simple: false, spelling: "auto", libFilter: "all", recent: [], toured: false, seeded: false,
};
const S = {
  songs: [], settings: { ...DEFAULT_SETTINGS }, setlists: [], prefs: {},
  filtered: [], artist: ALL_ARTISTS, current: null, index: -1,
  steps: 0, speed: 0.5, delay: 20, size: 15, choice: {},
  reorder: false, stage: false,
};

function songFromRecord(r) {
  const [title, artist] = C.parseSongMeta(r.name, r.content);
  return { name: r.name, content: r.content, mtime: r.mtime || Date.now(), title, artist };
}
function findSong(name) { return S.songs.find(s => s.name === name) || null; }
async function saveSong(song) {
  [song.title, song.artist] = C.parseSongMeta(song.name, song.content);
  await Store.put("song:" + song.name, { name: song.name, content: song.content, mtime: song.mtime });
}
function saveSettings() { Store.put("settings", S.settings); }
function saveSetlists() { Store.put("setlists", { setlists: S.setlists }); }
let prefsTimer = null;
function savePrefsSoon() { clearTimeout(prefsTimer); prefsTimer = setTimeout(() => Store.put("prefs", S.prefs), 600); }

// ---------------------------------------------------------------- small UI helpers
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
let toastTimer = null;
function toast(msg, actionLabel, action, ms) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement("button"); b.textContent = actionLabel;
    b.onclick = () => { t.remove(); action(); }; t.appendChild(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms || (actionLabel ? 7000 : 2600));
}

// Layers (menus, dialogs, full screens, the song screen) are tied to the browser
// history so the Android back button closes the top one.
const layers = [];
let historyOK = !IN_FRAME;
function pushLayer(layer) {
  layers.push(layer);
  if (historyOK) try { history.pushState({ layer: layers.length }, ""); } catch (e) { historyOK = false; }
}
const closeWaiters = [];
function closeTop() {
  if (!layers.length) return Promise.resolve();
  const p = new Promise(res => closeWaiters.push(res));
  if (historyOK) history.back(); else popLayer();
  return p;
}
function releaseWaiters() { while (closeWaiters.length) closeWaiters.shift()(); }
async function popLayer() {
  const top = layers[layers.length - 1];
  if (!top) return;
  if (top.canClose && !(await top.canClose())) {
    if (historyOK) try { history.pushState({ layer: layers.length }, ""); } catch (e) {}

  top.close();

}

function makeLayer(html, cls) {
  const el = document.createElement("div");
  el.className = "layer " + (cls || "");
  el.innerHTML = html;
  $("layers").appendChild(el);
  return el;
}

// Bottom action sheet. items: {label, action, checked, disabled, danger, arrow} or "sep"
function actionSheet(title, items) {
  const el = makeLayer(`<div class="backdrop"></div><div class="sheetmenu"><div class="grab"></div>${title ? `<div class="mt">${esc(title)}</div>` : ""}</div>`);
  const box = el.querySelector(".sheetmenu");
  let chosen = null;
  for (const it of items) {
    if (it === "sep") { box.insertAdjacentHTML("beforeend", '<div class="sep"></div>'); continue; }
    const b = document.createElement("button");
    b.className = "mi" + (it.danger ? " danger" : "");
    b.disabled = !!it.disabled;
    b.innerHTML = `<span>${esc(it.label)}</span>` + (it.checked !== undefined ? `<span class="ck ${it.checked ? "on" : ""}"></span>` : "") +
      (it.arrow ? '<span class="arrow">›</span>' : "");
    b.onclick = () => { chosen = it; closeTop(); };
    box.appendChild(b);
  }
  el.querySelector(".backdrop").onclick = () => closeTop();
  pushLayer({ close: () => { el.remove(); if (chosen && chosen.action) setTimeout(chosen.action, 30); } });
}

function dialog({ title, message, fields, buttons }) {
  return new Promise(resolve => {
    const el = makeLayer(`<div class="backdrop"></div><div class="dialog"><h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ""}<div class="flds"></div><div class="btns"></div></div>`);
    const flds = el.querySelector(".flds"), btns = el.querySelector(".btns");
    const inputs = (fields || []).map(f => {
      const d = document.createElement("div"); d.className = "field";
      d.innerHTML = `<label>${esc(f.label)}</label>` + (f.multiline ? "<textarea></textarea>" : "<input>");
      const inp = d.querySelector("input, textarea"); inp.value = f.value || ""; inp.placeholder = f.placeholder || "";
      flds.appendChild(d); return inp;
    });
    let result = null;
    const finish = v => { result = v; closeTop(); };
    for (const b of buttons) {
      const e = document.createElement("button");
      e.className = "btn " + (b.cls || ""); e.textContent = b.label;
      e.onclick = () => {
        const vals = inputs.map(i => i.value.trim());
        if (b.value !== false && b.value !== null && fields && fields[0] && fields[0].required && !vals[0]) { inputs[0].focus(); return; }
        finish(fields ? (b.value === null ? null : b.value === true ? vals : b.value) : b.value);
      };

    el.querySelector(".backdrop").onclick = () => closeTop();
    pushLayer({ close: () => { el.remove(); resolve(result); } });
    if (inputs[0]) setTimeout(() => { inputs[0].focus(); inputs[0].select(); }, 60);
  });
}

  buttons: [{ label: "Cancel", value: false }, { label: ok || "OK", value: true, cls: danger ? "danger" : "primary" }] });
const alertBox = (title, message) => dialog({ title, message, buttons: [{ label: "OK", value: true, cls: "primary" }] });

// ---------------------------------------------------------------- theme
function applyTheme() {
  document.body.className = document.body.className.replace(/\b(dark|light)\b/g, "").trim() + " " + S.settings.theme;
  $("themeBtn").innerHTML = icon(S.settings.theme === "dark" ? "sun" : "moon");

// ---------------------------------------------------------------- library
function setlistByName(n) { return S.setlists.find(x => x.name === n) || null; }
function setlistSongs() { const sl = setlistByName(S.settings.currentSetlist); return sl ? sl.songs : []; }

function refreshArtistSelect() {
  const artists = [...new Set(S.songs.map(s => s.artist).filter(Boolean))].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  const vals = [ALL_ARTISTS, ...artists];
  if (!vals.includes(S.artist)) S.artist = ALL_ARTISTS;

  const f = inSet ? "all" : S.settings.libFilter;
  let pool;
  const by = new Map(S.songs.map(s => [s.name, s]));
  if (inSet) pool = setlistSongs().map(n => by.get(n)).filter(Boolean);
  else if (f === "recent") pool = S.settings.recent.map(n => by.get(n)).filter(Boolean);
  else if (f === "fav") pool = S.songs.filter(s => isFav(s.name));

  document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c.dataset.f === S.settings.libFilter));

    if (!inSet && S.artist !== ALL_ARTISTS && s.artist.toLowerCase() !== S.artist.toLowerCase()) return false;
    if (words.length) {
      let hay = `${s.name} ${s.title} ${s.artist}`.toLowerCase();
      if (S.settings.searchLyrics) hay += " " + s.content.toLowerCase();
      if (!words.every(w => hay.includes(w))) return false;
    }

  });

    const k = S.settings.sort, lc = s => s.toLowerCase();
    const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

    else if (k === "Name (Z-A)") res.sort((a, b) => cmp(lc(b.title), lc(a.title)));
    else if (k === "Artist (A-Z)") res.sort((a, b) => cmp(lc(a.artist) || "~", lc(b.artist) || "~") || cmp(lc(a.title), lc(b.title)));

function renderList() {

  const cur = S.current ? S.current.name : S.settings.lastSong;
  if (!S.filtered.length) {
    let msg = "No songs found";
    if (!inSet && !S.songs.length) msg = "No songs yet.\nTap \"Add song\" to paste one,\nor ⋯ > Import song files.";
    else if (!inSet && S.settings.libFilter === "fav" && !$("search").value.trim()) msg = "No favourites yet.\nOpen a song and tap the ☆ star at the top.";
    else if (!inSet && S.settings.libFilter === "recent" && !$("search").value.trim()) msg = "Songs you open show up here.";
    else if (inSet && !S.setlists.length) msg = "No setlists yet.\nTap + above to make one.";
    else if (inSet && !setlistSongs().length) msg = "This setlist is empty.\nOpen a song and use ⋯ > Add to setlist.";
    list.innerHTML = `<div class="empty">${esc(msg)}</div>`;

    list.innerHTML = S.filtered.map((s, i) =>

      (inSet ? `<span class="num">${i + 1}</span>` : "") +
      `<div class="txt"><div class="t">${isFav(s.name) ? '<span class="favmark">★</span>' : ""}${esc(s.title)}</div><div class="a${s.artist ? "" : " unk"}">${esc(s.artist || "Unknown artist")}</div></div>` +
      (inSet && S.reorder ? `<div class="ord"><button class="ibtn" data-mv="-1" aria-label="Up">${icon("up")}</button><button class="ibtn" data-mv="1" aria-label="Down">${icon("down")}</button><button class="ibtn" data-rm="1" aria-label="Remove">${icon("x")}</button></div>` : "") +
      `</div>`).join("");

  const i = +row.dataset.i, song = S.filtered[i];

function setView(v) {

  $("filters").classList.toggle("hidden", v !== "library");
  $("setRow").classList.toggle("hidden", v !== "setlist");
  $("addBtn").classList.toggle("hidden", v !== "library");
  $("chips").classList.toggle("hidden", v !== "library");

// ---------------------------------------------------------------- song screen
function openSong(i) {
  const song = S.filtered[i]; if (!song) return;
  const wasOpen = !$("songScreen").classList.contains("hidden");
  stopAll(); metroStop();
  S.index = i; S.current = song; S.choice = {}; S.selChord = null;
  S.settings.lastSong = song.name;
  S.settings.recent = [song.name, ...S.settings.recent.filter(n => n !== song.name)].slice(0, 30);
  saveSettings();
  if (!wasOpen) $("songScreen").classList.remove("hidden");

  updateSubtitle();
  renderSong();
  $("sheetScroll").scrollTop = 0; $("sheetScroll").scrollLeft = 0;
  S.started = false; S.countdownLeft = null;
  setStatus("Tap play to start");
  updatePlay();
  $("prevBtn").disabled = i <= 0; $("nextBtn").disabled = i >= S.filtered.length - 1;
  if (!wasOpen) {
    pushLayer({ close: closeSongScreen });

  }
}
function closeSongScreen() {
  stopAll(); metroStop();
  if (S.stage) toggleStage();
  $("songScreen").classList.add("hidden");

function diagramSVG(name, frets, idx, total, simplified, small) {
  const W = 100, H = 142;
  let o = `<svg viewBox="0 0 ${W} ${H}">`;
  const fs = name.length > 7 ? 10 : name.length > 5 ? 11.5 : 13;
  o += `<text class="dg-name" x="50" y="16" text-anchor="middle" style="font-size:${fs}px">${esc(name)}</text>`;
  if (!frets) return o + `<text class="dg-foot" x="50" y="80" text-anchor="middle">No diagram</text></svg>`;
  const left = 24, right = 88, markY = 32, top = 41, bottom = 123;
  const sx = (right - left) / 5, fy = (bottom - top) / 5;
  const played = frets.filter(f => f !== null), fretted = played.filter(f => f > 0);
  const start = !fretted.length || Math.max(...fretted) <= 5 ? 1 : Math.min(...fretted);
  for (let i = 0; i < 6; i++) o += `<line class="dg-line" x1="${left + i * sx}" y1="${top}" x2="${left + i * sx}" y2="${bottom}"/>`;
  for (let j = 0; j < 6; j++) o += `<line class="dg-line" x1="${left}" y1="${top + j * fy}" x2="${right}" y2="${top + j * fy}"/>`;
  if (start === 1) o += `<line class="dg-nut" x1="${left - 1}" y1="${top}" x2="${right + 1}" y2="${top}"/>`;
  else o += `<text class="dg-mark" x="${left - 4}" y="${top + fy / 2 + 4}" text-anchor="end">${small ? start : start + "fr"}</text>`;
  const r = Math.min(sx, fy) * 0.34;
  frets.forEach((f, i) => {
    const cx = left + i * sx;
    if (f === null) o += `<text class="dg-mark" x="${cx}" y="${markY + 4}" text-anchor="middle">×</text>`;
    else if (f === 0) o += `<circle class="dg-open" cx="${cx}" cy="${markY}" r="${r * 0.72}"/>`;
  });
  let barre = null;
  if (fretted.length && !played.includes(0) && frets[5] !== null) {
    const low = Math.min(...fretted);
    const onLow = frets.map((f, i) => (f === low ? i : -1)).filter(i => i >= 0);
    if (onLow.length >= 2 && frets[5] === low) barre = [low, onLow[0]];
  }
  if (barre) {
    const cy = top + (barre[0] - start + 0.5) * fy;
    o += `<line class="dg-barre" x1="${left + barre[1] * sx}" y1="${cy}" x2="${right}" y2="${cy}" stroke-width="${r * 2}"/>`;
  }
  frets.forEach((f, i) => {
    if (f === null || f === 0 || (barre && f === barre[0] && i >= barre[1])) return;
    const row = f - start; if (row < 0 || row > 4) return;
    o += `<circle class="dg-dot" cx="${left + i * sx}" cy="${top + (row + 0.5) * fy}" r="${r}"/>`;
  });
  o += `<g class="foot">`;
  if (total > 1) o += `<text class="dg-foot" x="92" y="137" text-anchor="end">${idx + 1}/${total}</text>`;
  if (simplified) o += `<text class="dg-foot" x="8" y="137">basic shape</text>`;
  return o + `</g></svg>`;
}

// pinch with two fingers on the song to change text size

// metronome: Web Audio clicks, first beat of each bar higher
const Metro = { on: false, ctx: null, timer: 0, next: 0, beat: 0 };
function metroStart() {
  try { Metro.ctx = Metro.ctx || new (window.AudioContext || window.webkitAudioContext)(); Metro.ctx.resume(); }
  catch (e) { toast("Sound is not available here"); return; }
  Metro.on = true; Metro.beat = 0; Metro.next = Metro.ctx.currentTime + 0.08;
  metroTick(); renderBeatBar();
}
function metroStop() {
  if (!Metro.on) return;
  Metro.on = false; clearTimeout(Metro.timer); renderBeatBar();
}
function metroTick() {
  if (!Metro.on) return;
  const ctx = Metro.ctx, spb = 60 / Math.max(30, Math.min(300, S.bpm));
  while (Metro.next < ctx.currentTime + 0.12) {
    const acc = Metro.beat % 4 === 0, b = Metro.beat % 4, at = Metro.next;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = acc ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(acc ? 0.9 : 0.55, at + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at + 0.06);
    setTimeout(() => flashBeat(b), Math.max(0, (at - ctx.currentTime) * 1000));
    Metro.next += spb; Metro.beat++;
  }
  Metro.timer = setTimeout(metroTick, 25);
}
function flashBeat(b) {
  document.querySelectorAll("#beatBar .dot").forEach((d, k) => d.classList.toggle("on", k === b && Metro.on));
}
function renderBeatBar() {
  const show = Metro.on || !!S.strum;
  $("beatBar").classList.toggle("hidden", !show);
  $("metroBtn").innerHTML = icon("metro");
  $("metroBtn").classList.toggle("on", Metro.on);
  if (!show) return;
  $("beatBar").innerHTML = (Metro.on ? '<span class="dots"><i class="dot acc"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>' : "") +
    `<span>♩ <b>${S.bpm}</b></span>` + (S.strum ? `<span>Strum <b>${esc(S.strum)}</b></span>` : "");
}
function metroSettings() {
  const el = makeLayer(`<div class="backdrop"></div><div class="dialog metro"><h3>Metronome and strumming</h3>
    <div class="big" data-bpm></div><div style="text-align:center;color:var(--sub);font-size:13px">beats per minute</div>
    <div class="row2"><button class="btn" data-d="-5">−5</button><button class="btn" data-d="-1">−1</button><button class="btn" data-tap>Tap</button><button class="btn" data-d="1">+1</button><button class="btn" data-d="5">+5</button></div>
    <div class="field"><label>Strumming pattern (D down, U up)</label><input data-strum placeholder="D D U U D U"></div>
    <div class="btns"><button class="btn" data-play></button><button class="btn primary" data-ok>Done</button></div></div>`);
  const q = x => el.querySelector(x);
  let bpm = S.bpm, taps = [];
  const show = () => { q("[data-bpm]").textContent = bpm; q("[data-play]").textContent = Metro.on ? "Stop clicks" : "Start clicks"; };
  q("[data-strum]").value = S.strum;
  el.querySelectorAll("[data-d]").forEach(b => (b.onclick = () => { bpm = Math.max(30, Math.min(300, bpm + +b.dataset.d)); S.bpm = bpm; show(); }));
  q("[data-tap]").onclick = () => {
    const now = performance.now();
    taps = taps.filter(t => now - t < 2500); taps.push(now);
    if (taps.length >= 3) {
      const gaps = taps.slice(1).map((t, k) => t - taps[k]);
      bpm = Math.max(30, Math.min(300, Math.round(60000 / (gaps.reduce((a, b) => a + b, 0) / gaps.length)))); S.bpm = bpm; show();
    }
  };
  q("[data-play]").onclick = () => { Metro.on ? metroStop() : metroStart(); show(); };
  q("[data-ok]").onclick = () => closeTop();
  el.querySelector(".backdrop").onclick = () => closeTop();
  show();
  pushLayer({ close: () => {
    S.bpm = bpm; S.strum = q("[data-strum]").value.replace(/\s+/g, " ").trim();
    remember("bpm", bpm); remember("strum", S.strum); renderBeatBar(); el.remove();
  } });
}

// guitar tuner: microphone, pitch by autocorrelation
const STRINGS = [["E", 82.41], ["A", 110.0], ["D", 146.83], ["G", 196.0], ["B", 246.94], ["e", 329.63]];
function detectPitch(buf, rate) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / buf.length) < 0.008) return 0;
  const minLag = Math.floor(rate / 1000), maxLag = Math.min(Math.floor(rate / 60), buf.length >> 1);
  const n = buf.length - maxLag, corr = new Float32Array(maxLag + 2);
  for (let lag = minLag; lag <= maxLag + 1; lag++) {
    let sum = 0, e1 = 0, e2 = 0;
    for (let i = 0; i < n; i++) { const a = buf[i], b = buf[i + lag]; sum += a * b; e1 += a * a; e2 += b * b; }
    corr[lag] = sum / (Math.sqrt(e1 * e2) || 1);
  }
  let best = -1, bestLag = 0;
  const top = Math.max(...corr.slice(minLag, maxLag + 1));
  for (let lag = minLag + 1; lag <= maxLag; lag++) {   // first strong peak: avoids octave errors
    if (corr[lag] > 0.9 * top && corr[lag] >= corr[lag - 1] && corr[lag] >= corr[lag + 1]) { best = corr[lag]; bestLag = lag; break; }
  }
  if (best < 0.6 || !bestLag) return 0;
  const a = corr[bestLag - 1], b = corr[bestLag], c = corr[bestLag + 1];
  const shift = (a - c) / (2 * (a - 2 * b + c) || 1);
  return rate / (bestLag + (Math.abs(shift) < 1 ? shift : 0));
}
function openTuner() {
  const el = makeLayer(`<div class="full"><div class="bar"><button class="ibtn" data-x>${icon("back")}</button><h2>Guitar tuner</h2></div>
    <div class="body tuner"><div class="note" data-note>-</div><div class="cents" data-cents>Play one string</div>
    <div class="meter"><div class="mid"></div><div class="needle" data-needle></div></div>
    <div class="strings">${STRINGS.map(s => `<span>${s[0]}</span>`).join("")}</div>
    <div class="freq" data-freq>Standard tuning E A D G B E</div></div></div>`);
  const q = x => el.querySelector(x);
  let stream = null, ctx = null, raf = 0, stopped = false;
  const recent = [];
  el.querySelector("[data-x]").onclick = () => closeTop();
  pushLayer({ close: () => {
    stopped = true; cancelAnimationFrame(raf);
    try { stream && stream.getTracks().forEach(t => t.stop()); ctx && ctx.close(); } catch (e) {}
    el.remove();
  } });
  const fail = msg => { q("[data-cents]").textContent = msg; };
  if (IN_FRAME) { fail("The microphone is blocked on this test page. The tuner works in the app opened from its own address or installed."); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fail("This browser cannot use the microphone"); return; }
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(st => {
    if (stopped) { st.getTracks().forEach(t => t.stop()); return; }
    stream = st;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(st), an = ctx.createAnalyser();
    an.fftSize = 4096; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let last = 0;
    const loop = now => {
      if (stopped) return;
      raf = requestAnimationFrame(loop);
      if (now - last < 60) return;
      last = now;
      an.getFloatTimeDomainData(buf);
      const f = detectPitch(buf, ctx.sampleRate);
      if (!f) return;
      recent.push(f); if (recent.length > 5) recent.shift();
      const freq = [...recent].sort((a, b) => a - b)[recent.length >> 1];
      const n = 12 * Math.log2(freq / 440) + 69, near = Math.round(n), cents = Math.round((n - near) * 100);
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      q("[data-note]").innerHTML = `${names[((near % 12) + 12) % 12]}<span class="oct">${Math.floor(near / 12) - 1}</span>`;
      q("[data-cents]").textContent = Math.abs(cents) <= 4 ? "In tune" : cents < 0 ? `${-cents} cents flat: tighten` : `${cents} cents sharp: loosen`;
      q("[data-needle]").style.left = (50 + Math.max(-50, Math.min(50, cents))) + "%";
      q("[data-needle]").classList.toggle("ok", Math.abs(cents) <= 4);
      q("[data-freq]").textContent = freq.toFixed(1) + " Hz";
      let k = 0;
      STRINGS.forEach((s, i) => { if (Math.abs(Math.log2(freq / s[1])) < Math.abs(Math.log2(freq / STRINGS[k][1]))) k = i; });
      el.querySelectorAll(".strings span").forEach((sp, i) => sp.classList.toggle("on", i === k));
    };
    raf = requestAnimationFrame(loop);
  }).catch(() => fail("Allow the microphone to use the tuner (Chrome asks the first time)"));
}

// songbook PDF: each song with its own key and capo
function pdfItems(songs) {
  return songs.map(song => {
    const p = S.prefs[song.name] || {};
    const fileCapo = C.parseCapo(song.content);
    const key = parseInt(p.key || 0, 10) || 0, capo = p.capo !== undefined ? parseInt(p.capo, 10) || 0 : fileCapo;
    let src = C.stripMetaHeader(sourceText(song));
    if (capo !== fileCapo) src = C.setCapoLine(src, capo);
    const sh = key - capo + fileCapo;
    let text = C.shiftText(src, sh, C.spellingFor(src, sh, S.settings.spelling));
    if (S.settings.simple) text = C.simplifyText(text);
    const info = [capo ? "Capo " + capo : "", key ? "Key " + (key > 0 ? "+" : "") + key : "", S.settings.simple ? "Simple chords" : "",
      p.bpm ? p.bpm + " bpm" : "", p.strum ? "Strum " + p.strum : ""].filter(Boolean).join(" \u00b7 ");
    return { title: song.title, artist: song.artist, info, notes: p.notes || "", text };
  });
}
function savePdf(songs, heading) {
  if (!songs.length) { toast("No songs to put in the PDF"); return; }
  if (IN_FRAME) { alertBox("Save as PDF", "Saving files is blocked in this test page. PDFs work in the app opened from its own web address or installed on the phone."); return; }
  const bytes = C.songbookPdf(pdfItems(songs), heading || "Songbook");
  const name = (C.safeFilename(heading || "Songbook") || "Songbook") + ".pdf";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  toast(`Saved ${name} to Downloads`);
}

}

function fileBase(title, artist) { return C.safeFilename(artist ? `${artist} - ${title}` : title); }

async function renameSong() {
  const song = S.current; if (!song) return;
  const r = await dialog({ title: "Rename song", message: "The song name and its Title / Artist lines are updated.",
    fields: [{ label: "Song title", value: song.title, required: true }, { label: "Artist (optional)", value: song.artist }],
    buttons: [{ label: "Cancel", value: null }, { label: "Rename", value: true, cls: "primary" }] });
  if (!r) return;
  const [title, artist] = r;
  const base = fileBase(title, artist);
  if (!base) { await alertBox("Rename song", "That name cannot be used."); return; }
  const newName = base + ".txt";
  const clash = findSong(newName);
  if (clash && clash !== song) { await alertBox("Rename song", `"${newName}" already exists.`); return; }
  const old = song.name;
  song.content = C.setSongMeta(song.content, title, artist);
  song.mtime = Date.now();
  if (newName !== old) {
    await Store.del("song:" + old);
    song.name = newName;
    renameEverywhere(old, newName);
  }
  await saveSong(song);
  S.settings.lastSong = song.name; saveSettings();
  $("songTitle").textContent = song.title; $("songArtist").textContent = song.artist || "Unknown artist";
  refreshArtistSelect(); applyFilters();
  S.index = S.filtered.indexOf(song);
  renderSong(); toast("Renamed");
}
function renameEverywhere(old, nw) {
  S.settings.recent = S.settings.recent.map(n => (n === old ? nw : n)).filter(Boolean); saveSettings();
  for (const sl of S.setlists) sl.songs = sl.songs.map(n => (n === old ? nw : n)).filter(n => n !== null);
  if (S.prefs[old]) { if (nw) S.prefs[nw] = S.prefs[old]; delete S.prefs[old]; }
  saveSetlists(); savePrefsSoon();
}
async function deleteSong() {
  const song = S.current; if (!song) return;
  if (!(await confirmBox("Delete song", `Delete "${song.title}"?`, "Delete", true))) return;
  const memberships = S.setlists.map(sl => [sl, sl.songs.indexOf(song.name)]).filter(x => x[1] >= 0);
  const prefs = S.prefs[song.name];
  S.songs = S.songs.filter(s => s !== song);
  await Store.del("song:" + song.name);
  renameEverywhere(song.name, null);
  await closeTop();
  S.current = null;
  refreshArtistSelect(); applyFilters();
  toast(`Deleted "${song.title}"`, "Undo", async () => {
    S.songs.push(song); await saveSong(song);
    for (const [sl, at] of memberships) { if (S.setlists.includes(sl)) sl.songs.splice(at, 0, song.name); }
    if (prefs) S.prefs[song.name] = prefs;
    saveSetlists(); savePrefsSoon(); refreshArtistSelect(); applyFilters();
  });
}
async function shareSong() {
  const song = S.current;
  const text = C.transposeText(sourceText(song), S.steps);
  try {
    if (navigator.share) { await navigator.share({ title: song.title, text }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Song copied. Paste it anywhere"); }
  catch (e) { toast("Sharing is not available here"); }
}

function decodeText(bytes) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("windows-1252").decode(bytes); }
}
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const out = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(out);
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("not a zip file");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = [];
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loc = dv.getUint32(p + 42, true);
    const dt = dv.getUint16(p + 12, true), dd = dv.getUint16(p + 14, true);
    const mtime = new Date(((dd >> 9) & 0x7f) + 1980, ((dd >> 5) & 0xf) - 1, dd & 0x1f, dt >> 11, (dt >> 5) & 0x3f, (dt & 0x1f) * 2).getTime();
    const nameBytes = u8.subarray(p + 46, p + 46 + nlen);
    const name = (flags & 0x800) ? new TextDecoder().decode(nameBytes) : decodeText(nameBytes);
    p += 46 + nlen + xlen + clen;
    if (name.endsWith("/")) continue;
    const start = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true);
    const data = u8.subarray(start, start + csize);
    try {
      if (method === 0) files.push({ name, bytes: data, mtime });
      else if (method === 8) files.push({ name, bytes: await inflateRaw(data), mtime });
    } catch (e) {}
  }
  return files;
}
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function makeZip(entries) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), data = typeof e.data === "string" ? enc.encode(e.data) : e.data;
    const d = new Date(e.mtime || Date.now());
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((Math.max(1980, d.getFullYear()) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}

async function importFiles(fileList) {
  const found = [];   // {name, text}
  let setlistsData = null, prefsData = null, skipped = 0;
  for (const f of fileList) {
    const lower = f.name.toLowerCase();
    try {
      if (lower.endsWith(".zip")) {
        for (const z of await unzip(await f.arrayBuffer())) {
          const path = z.name.replace(/\\/g, "/");
          if (/(^|\/)(__MACOSX|_deleted_songs|_original_songs)\//i.test(path)) continue;
          const base = path.split("/").pop();
          if (base.toLowerCase() === "setlists.json") { try { setlistsData = JSON.parse(decodeText(z.bytes)); } catch (e) {} continue; }
          if (base.toLowerCase() === "song_settings.json") { try { prefsData = JSON.parse(decodeText(z.bytes)); } catch (e) {} continue; }
          if (/\.(txt|cho|chopro|pro)$/i.test(base) && !base.startsWith(".")) found.push({ name: base, text: decodeText(z.bytes), mtime: z.mtime });
          else skipped++;
        }
      } else if (/\.(txt|cho|chopro|pro)$/i.test(lower) || f.type.startsWith("text/")) {
        found.push({ name: f.name, text: decodeText(new Uint8Array(await f.arrayBuffer())), mtime: f.lastModified || Date.now() });
      } else if (lower === "setlists.json") { setlistsData = JSON.parse(await f.text()); }
      else if (lower === "song_settings.json") { prefsData = JSON.parse(await f.text()); }
      else skipped++;
    } catch (e) { skipped++; }
  }
  for (const x of found) x.name = x.name.replace(/\.(cho|chopro|pro)$/i, ".txt").replace(/^(?!.*\.txt$)(.*)$/i, "$1.txt");
  // the newest copy of each song wins, so phone and PC can swap one zip back and forth
  let added = 0, replaced = 0, kept = 0;
  const fresh = new Set();
  for (const x of found) {
    const old = findSong(x.name);
    const when = x.mtime || Date.now();
    if (old) {
      if (old.content === x.text) continue;
      if (when > old.mtime + 2000) { old.content = x.text; old.mtime = when; await saveSong(old); replaced++; fresh.add(x.name); }
      else kept++;
    } else {
      const s = songFromRecord({ name: x.name, content: x.text, mtime: when });
      S.songs.push(s); await saveSong(s); added++; fresh.add(x.name);
    }
  }
  let lists = 0;
  if (setlistsData && Array.isArray(setlistsData.setlists)) {
    for (const x of setlistsData.setlists) {
      if (!x || typeof x !== "object") continue;
      const name = String(x.name || "Setlist"), songs = (x.songs || []).map(String);
      const have = setlistByName(name);
      if (have) songs.forEach(n => { if (!have.songs.includes(n)) have.songs.push(n); });
      else { S.setlists.push({ name, songs }); lists++; }
    }
    saveSetlists();
  }
  if (prefsData && typeof prefsData === "object") {
    for (const [k, v] of Object.entries(prefsData)) {
      if (!v || typeof v !== "object") continue;
      S.prefs[k] = fresh.has(k) ? { ...(S.prefs[k] || {}), ...v } : { ...v, ...(S.prefs[k] || {}) };
    }
    savePrefsSoon();
  }
  refreshArtistSelect(); refreshSetlistSelect(); applyFilters();
  const parts = [`${added} song${added === 1 ? "" : "s"} added`];
  if (replaced) parts.push(`${replaced} updated to the newer copy`);
  if (kept) parts.push(`${kept} kept (yours were newer)`);
  if (lists) parts.push(`${lists} setlist${lists === 1 ? "" : "s"}`);
  if (skipped) parts.push(`${skipped} other file${skipped === 1 ? "" : "s"} skipped`);
  await alertBox("Import finished", parts.join(", ") + ".");
}
$("fileInput").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) importFiles(f); });

function backupZip() {
  const entries = S.songs.map(s => ({ name: s.name, data: s.content.replace(/\r?\n/g, "\r\n"), mtime: s.mtime }));
  entries.push({ name: "setlists.json", data: JSON.stringify({ setlists: S.setlists }, null, 2) });
  entries.push({ name: "song_settings.json", data: JSON.stringify(S.prefs, null, 2) });
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return { blob: makeZip(entries), name: `ChordLibrary-songs-${stamp}.zip` };
}
function exportAll() {
  if (!S.songs.length) { toast("No songs to export"); return; }
  if (IN_FRAME) { alertBox("Export", "Saving files is blocked in this test page. Export works in the app opened from its own web address or installed on the phone."); return; }
  const { blob, name } = backupZip();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();

async function shareBackup() {
  const { blob, name } = backupZip();
  const file = new File([blob], name, { type: "application/zip" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  exportAll();
}
