    const el = $("sheetScroll");
    if (e.key === " ") { e.preventDefault(); if (S.advanceTimer) advanceNow(); else if (S.active && !S.started) beginScrolling(); else togglePlay(); }
    else if (e.key === "PageDown" || e.key === "ArrowDown") { e.preventDefault(); el.scrollBy({ top: el.clientHeight * 0.8, behavior: "smooth" }); }
    else if (e.key === "PageUp" || e.key === "ArrowUp") { e.preventDefault(); el.scrollBy({ top: -el.clientHeight * 0.8, behavior: "smooth" }); }
    else if (e.key === "ArrowRight" && e.ctrlKey) stepSong(1);
    else if (e.key === "ArrowLeft" && e.ctrlKey) stepSong(-1);
  });
}

function openAbout() {
  const el = makeLayer(`<div class="full"><div class="bar"><button class="ibtn" data-x>${icon("back")}</button><h2>About</h2></div><div class="body help">
    <h4>Chord Library ${APP_VERSION}</h4>A songbook for guitar: chords above the lyrics, transpose, capo helper, auto-scroll, chord diagrams, setlists, metronome and tuner. Free, no ads.
    <h4>Privacy</h4>Your songs, setlists and settings are stored only on this phone, inside the app. Nothing is sent anywhere: there is no account, no tracking and no advertising. The microphone is used only while the tuner is open, and the sound never leaves the phone. Files go out only when you export or share them yourself.
    <h4>Songs</h4>The app comes with one welcome song. The songs you add are your own; please respect the rights of their authors.
    </div></div>`);
  el.querySelector("[data-x]").onclick = () => closeTop();
  pushLayer({ close: () => el.remove() });
}
function openTour() {
  const pages = [
    ["♫", "Welcome to Chord Library", "Your guitar songbook: chords above the lyrics, auto-scroll and chord diagrams. Everything stays on this phone."],
    ["＋", "Add songs", "Copy a song with chords on any website and tap Add song > Paste. Or bring your PC songs with ⋯ > Import song files."],
    ["▶", "Play", "Play scrolls the song for you. KEY changes the key, ⋯ > Capo finds easier shapes, and the star keeps your favourites at hand."],
  ];
  let k = 0;
  const el = makeLayer('<div class="backdrop"></div><div class="dialog tour"></div>');
  const box = el.querySelector(".tour");
  const show = () => {
    const [ico, h, t] = pages[k];
    box.innerHTML = `<div class="big">${ico}</div><h3>${esc(h)}</h3><p>${esc(t)}</p><div class="dots">${pages.map((x, i) => `<i class="${i === k ? "on" : ""}"></i>`).join("")}</div>
      <div class="btns" style="justify-content:space-between"><button class="btn" data-skip>Skip</button><button class="btn primary" data-next>${k < pages.length - 1 ? "Next" : "Start"}</button></div>`;
    box.querySelector("[data-skip]").onclick = () => closeTop();
    box.querySelector("[data-next]").onclick = () => { if (k < pages.length - 1) { k++; show(); } else closeTop(); };
  };
  show();
  pushLayer({ close: () => { el.remove(); S.settings.toured = true; saveSettings(); } });
}

const DEMO_SONG = `Title: Welcome to Chord Library
Artist: Chord Library

[Verse 1]
[G]Tap a song to [D]open it up
[Em]Press play and the [C]words roll by
[G]Turn the key with [D]flat and sharp
[C]Tap a chord to [D]see another shape

[Chorus]
G        D         Em        C
Add your songs from the menu
G          D          C       D
Paste them in and they line up too
`;

async function init() {
  await Store.open();
  const all = await Store.all();
  S.settings = { ...DEFAULT_SETTINGS, ...(all.get("settings") || {}) };
  if (!Array.isArray(S.settings.recent)) S.settings.recent = [];
  const sl = all.get("setlists");
  S.setlists = (sl && Array.isArray(sl.setlists) ? sl.setlists : []).filter(x => x && typeof x === "object")
    .map(x => ({ name: String(x.name || "Setlist"), songs: (x.songs || []).map(String) }));
  const pr = all.get("prefs"); S.prefs = pr && typeof pr === "object" ? pr : {};
  for (const [k, v] of all) if (k.startsWith("song:") && v && typeof v.content === "string") S.songs.push(songFromRecord(v));
  if (!S.songs.length && !S.settings.seeded) {
    const demo = songFromRecord({ name: "Chord Library - Welcome to Chord Library.txt", content: DEMO_SONG, mtime: Date.now() });
    S.songs.push(demo); await saveSong(demo);
  }
  if (!S.settings.seeded) { S.settings.seeded = true; saveSettings(); }
  applyTheme(); wire();
  refreshArtistSelect(); refreshSetlistSelect();
  setView(S.settings.view === "setlist" ? "setlist" : "library");
  if (Store.mode === "memory") toast("Songs cannot be stored in this browser. Use Export to keep them", null, null, 6000);
  if (!S.settings.toured) setTimeout(openTour, 300);

  // text shared to the installed app from another app (Android "Share" menu)
  const params = new URLSearchParams(location.search);
  const shared = [params.get("title"), params.get("text"), params.get("url")].filter(Boolean).join("\n");
  if (params.has("share") && shared) { history.replaceState(null, "", location.pathname); openAddSong(shared); }

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
init();
</script>
